apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: monitoring
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./apps/kbot
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
