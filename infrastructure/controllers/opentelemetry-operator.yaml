apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opentelemetry-operator
  namespace: opentelemetry-operator-system
spec:
  interval: 30m
  chart:
    spec:
      chart: opentelemetry-operator
      version: "0.122.1"
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    manager:
      # The k8s distribution has the otlp receiver/exporters and k8sattributes.
      collectorImage:
        repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s
    admissionWebhooks:
      # No cert-manager in this cluster: the chart generates the webhook cert.
      certManager:
        enabled: false
      autoGenerateCert:
        enabled: true
