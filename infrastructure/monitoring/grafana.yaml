apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: monitoring
spec:
  interval: 30m
  dependsOn:
    - name: prometheus
    - name: loki
    - name: tempo
  chart:
    spec:
      chart: grafana
      version: "13.2.4"
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # The admin password is generated by the chart into Secret monitoring/grafana.
    adminUser: admin
    persistence:
      enabled: false
    # Local demo cluster, reachable only via port-forward: read-only anonymous
    # access lets the dashboard open without a login. Editing still needs admin.
    grafana.ini:
      auth.anonymous:
        enabled: true
        org_role: Viewer
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        searchNamespace: monitoring
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus
            uid: prometheus
            type: prometheus
            access: proxy
            url: http://prometheus-server.monitoring.svc.cluster.local
            isDefault: true
          # Log line -> trace: the trace_id field of kbot JSON logs becomes a
          # link to the same trace in Tempo.
          - name: Loki
            uid: loki
            type: loki
            access: proxy
            url: http://loki.monitoring.svc.cluster.local:3100
            jsonData:
              derivedFields:
                - name: TraceID
                  matcherType: regex
                  matcherRegex: '"trace_id":"(\w+)"'
                  datasourceUid: tempo
                  url: "$${__value.raw}"
                  urlDisplayLabel: Open trace in Tempo
          # Trace -> logs: "Logs for this span" queries Loki by the pod
          # namespace and the trace ID.
          - name: Tempo
            uid: tempo
            type: tempo
            access: proxy
            url: http://tempo.monitoring.svc.cluster.local:3200
            jsonData:
              nodeGraph:
                enabled: true
              lokiSearch:
                datasourceUid: loki
              tracesToLogsV2:
                datasourceUid: loki
                spanStartTimeShift: "-5m"
                spanEndTimeShift: "5m"
                filterByTraceID: true
                filterBySpanID: false
                tags:
                  - key: k8s.namespace.name
                    value: namespace
